{{- if .Values.aws.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "meshcap.serviceAccountName" . }}
  labels:
    {{- include "meshcap.labels" . | nindent 4 }}
  {{- with .Values.aws.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
