services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "9200:9200"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      GOR_S3_BUCKET: capture
      GOR_S3_ENDPOINT: http://minio:9000
      GOR_S3_REGION: us-east-1
      GOR_FLUSH_INTERVAL: "30s"
    depends_on:
      createbuckets:
        condition: service_completed_successfully

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/capture --ignore-existing &&
      echo 'Bucket capture created'
      "
