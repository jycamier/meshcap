name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ko-build/setup-ko@v0.9

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KO_DOCKER_REPO: ghcr.io/jycamier/meshcap

  wasm:
    needs: [release-please, goreleaser]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oras-project/setup-oras@v1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download WASM artifact from release
        run: |
          gh release download ${{ needs.release-please.outputs.tag_name }} \
            --pattern "meshcap-wasm-plugin_*.tar.gz" \
            --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push WASM plugin to GHCR
        run: |
          VERSION=${{ needs.release-please.outputs.version }}
          oras push ghcr.io/jycamier/meshcap/wasm-plugin:${VERSION} \
            --config /dev/null:application/vnd.oci.image.config.v1+json \
            meshcap-wasm-plugin_${VERSION}.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip
          oras tag ghcr.io/jycamier/meshcap/wasm-plugin:${VERSION} latest

  helm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push Helm chart
        run: |
          helm package helm/meshcap \
            --version ${{ needs.release-please.outputs.version }} \
            --app-version ${{ needs.release-please.outputs.version }}
          helm push meshcap-${{ needs.release-please.outputs.version }}.tgz \
            oci://ghcr.io/jycamier/meshcap/chart
