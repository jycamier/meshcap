version: 2

project_name: meshcap

before:
  hooks:
    - go mod tidy

builds:
  - id: collector
    main: ./cmd/collector/
    binary: collector
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

kos:
  - id: collector
    build: collector
    repositories:
      - ghcr.io/jycamier/meshcap
    tags:
      - "{{ .Version }}"
      - latest
    bare: true
    preserve_import_paths: false
    base_image: cgr.dev/chainguard/static:latest
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: none
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: collector
    builds:
      - collector
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: jycamier
    name: meshcap
  draft: false
  prerelease: auto

after:
  hooks:
    # Build WASM plugin and push to ghcr.io via oras
    - cmd: >-
        sh -c '
        cd wasm &&
        GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared
        -ldflags "-X main.version={{ .Version }}"
        -o plugin.wasm . &&
        tar czf plugin.wasm.tar.gz plugin.wasm &&
        oras push ghcr.io/jycamier/meshcap/wasm-plugin:{{ .Version }}
        --config /dev/null:application/vnd.oci.image.config.v1+json
        plugin.wasm.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip
        '
