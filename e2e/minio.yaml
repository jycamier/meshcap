apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: capture
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: capture
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: api
    - port: 9001
      targetPort: 9001
      protocol: TCP
      name: console
      nodePort: 30001
  type: NodePort
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-bucket
  namespace: capture
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-minio
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Waiting for MinIO..."
              until wget -qO- http://minio.capture.svc:9000/minio/health/ready; do
                sleep 2
              done
              echo "MinIO is ready"
      containers:
        - name: mc
          image: minio/mc
          command:
            - sh
            - -c
            - |
              mc alias set local http://minio.capture.svc:9000 minioadmin minioadmin
              mc mb --ignore-existing local/capture
              echo "Bucket 'capture' created"
